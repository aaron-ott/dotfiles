# ==========================================
# GENERAL SETTINGS
# ==========================================

# Enable true color support for terminal applications (like Vim)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Enable mouse support for clicking, resizing panes, and scrolling
set -g mouse on

# Start window and pane numbering at 1 instead of 0 for easier reaching
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================================
# KEYBINDINGS
# ==========================================

# Change default prefix from Ctrl+b to Ctrl+a (easier to press)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload configuration file instantly with Prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using logical visual cues (| and -) instead of % and "
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Switch panes easily using Vim navigation keys (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes incrementally with Prefix + Ctrl + h/j/k/l
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Maximize/Minimize a pane with Prefix + m
bind -r m resize-pane -Z

# Use Vim-style keys in copy/scroll mode (activated by Prefix + [)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Don't exit copy mode when dragging the mouse selection
unbind -T copy-mode-vi MouseDragEnd1Pane

set-option -g default-shell /usr/bin/zsh
